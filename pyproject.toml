[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "set-solver"
version = "0.1.0"
description = "Classical-CV Set card detector and solver (Python prototype)"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.9,<5",
    "numpy>=1.26,<3",
]

[project.scripts]
set-solver = "set_solver.cli:main"

[tool.setuptools.packages.find]
include = ["set_solver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
